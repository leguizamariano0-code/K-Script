[package]
name = "korivm"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Kori Neural OS — Kernel Virtual (K-Script / .koko v2.0)"
license = "MIT"
repository = "https://github.com/leguizamariano0-code/k-script"
homepage = "https://k-script.vercel.app"
authors = ["Mariano Leguiza"]

[lib]
name = "korivm"
path = "src/lib.rs"

[dependencies]
# MVP: sin dependencias externas.
# Los módulos usan std (Vec, HashMap, String) — no_std se evaluará
# cuando portemos al ESP32.

[dev-dependencies]
# Nada aún. Si agregamos benchmarks: criterion = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.test]
opt-level = 1
